<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volvoice · 方案 E · 精准暗调 × 对讲机</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-head">
  <h1>方案 E · 精准暗调 × 对讲机</h1>
  <p>Linear 式发丝精度 + 无线电元素 · 待机 / 发射 双状态对照</p>
</header>

<main class="gallery">

  <!-- ============ 待机 RX ============ -->
  <figure class="scheme-block">
    <div class="phone scheme-e">
      <div class="bezel"><div class="screen">

        <div class="status-bar"><span>21:56</span><span class="sb-icons">●●● ⌁ ▮</span></div>

        <header class="e-top">
          <div class="e-brand">
            <span class="e-mark"></span>
            <span class="e-name">Volvoice</span>
            <span class="e-freq">2.4G · CH01</span>
          </div>
          <div class="e-chip rx"><span class="e-led"></span>RX</div>
        </header>

        <div class="wheel-zone">
          <div class="wheel">
            <div class="wheel-ring"></div>
            <div class="dial-ticks"></div>
            <div class="dial-label dl-n">01</div>
            <div class="dial-label dl-e">03</div>
            <div class="dial-label dl-s">05</div>
            <div class="dial-label dl-w">07</div>
            <div class="sat" style="--i:0"><i class="ch">01</i><span>继续</span></div>
            <div class="sat" style="--i:1"><i class="ch">02</i><span>解释</span></div>
            <div class="sat" style="--i:2"><i class="ch">03</i><span>测试</span></div>
            <div class="sat" style="--i:3"><i class="ch">04</i><span>修复</span></div>
            <div class="sat" style="--i:4"><i class="ch">05</i><span>重构</span></div>
            <div class="sat" style="--i:5"><i class="ch">06</i><span>提交</span></div>
            <div class="sat" style="--i:6"><i class="ch">07</i><span>清空</span></div>
            <div class="sat" style="--i:7"><i class="ch">08</i><span>＋</span></div>
            <div class="ptt">
              <span class="ptt-face">
                <span class="ptt-groove"></span>
                <svg class="ptt-mic" width="28" height="28" viewBox="0 0 24 24" fill="none">
                  <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
                  <path d="M6 11a6 6 0 0012 0M12 17v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span class="ptt-label">按住说话</span>
                <span class="ptt-sub">PUSH&nbsp;TO&nbsp;TALK</span>
              </span>
            </div>
          </div>
        </div>

        <footer class="e-result">
          <div class="e-signal-row">
            <div class="e-signal">
              <i class="sig-k">SIGNAL</i>
              <span class="bars"><b></b><b></b><b></b><b></b><b class="off"></b></span>
            </div>
            <div class="e-mac">MAC · 192.168.31.67</div>
          </div>
          <div class="grille"></div>
          <div class="e-result-msg">待机中 · 按住中央 PTT 说话</div>
          <div class="e-result-stats">
            <span><i>ASR</i>—</span>
            <span><i>PASTE</i>—</span>
            <span><i>TOTAL</i>—</span>
          </div>
        </footer>

      </div></div>
    </div>
    <figcaption><h2>待机 · RX</h2><p>绿色 RX 指示灯，信号格与频道信息就位，PTT 静候。</p></figcaption>
  </figure>

  <!-- ============ 发射 TX ============ -->
  <figure class="scheme-block">
    <div class="phone scheme-e tx-state">
      <div class="bezel"><div class="screen">

        <div class="status-bar"><span>21:56</span><span class="sb-icons">●●● ⌁ ▮</span></div>

        <header class="e-top">
          <div class="e-brand">
            <span class="e-mark"></span>
            <span class="e-name">Volvoice</span>
            <span class="e-freq">2.4G · CH01</span>
          </div>
          <div class="e-chip tx"><span class="e-led"></span>TX</div>
        </header>

        <div class="wheel-zone">
          <div class="wheel">
            <div class="wheel-ring"></div>
            <div class="dial-ticks"></div>
            <div class="dial-label dl-n">01</div>
            <div class="dial-label dl-e">03</div>
            <div class="dial-label dl-s">05</div>
            <div class="dial-label dl-w">07</div>
            <div class="sat" style="--i:0"><i class="ch">01</i><span>继续</span></div>
            <div class="sat" style="--i:1"><i class="ch">02</i><span>解释</span></div>
            <div class="sat" style="--i:2"><i class="ch">03</i><span>测试</span></div>
            <div class="sat" style="--i:3"><i class="ch">04</i><span>修复</span></div>
            <div class="sat" style="--i:4"><i class="ch">05</i><span>重构</span></div>
            <div class="sat" style="--i:5"><i class="ch">06</i><span>提交</span></div>
            <div class="sat" style="--i:6"><i class="ch">07</i><span>清空</span></div>
            <div class="sat" style="--i:7"><i class="ch">08</i><span>＋</span></div>
            <div class="ptt">
              <span class="ptt-face">
                <span class="ptt-groove"></span>
                <svg class="ptt-mic" width="28" height="28" viewBox="0 0 24 24" fill="none">
                  <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
                  <path d="M6 11a6 6 0 0012 0M12 17v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span class="ptt-label">松手发送</span>
                <span class="ptt-sub">TRANSMITTING</span>
              </span>
            </div>
          </div>
        </div>

        <footer class="e-result">
          <div class="e-signal-row">
            <div class="e-signal">
              <i class="sig-k">SIGNAL</i>
              <span class="bars live"><b></b><b></b><b></b><b></b><b></b></span>
            </div>
            <div class="e-mac">MAC · 录音中</div>
          </div>
          <div class="grille hot"></div>
          <div class="waveform">
            <b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b>
          </div>
          <div class="e-result-msg">正在发射 · 松手后转写上屏</div>
          <div class="e-result-stats">
            <span><i>ASR</i>…</span>
            <span><i>PASTE</i>…</span>
            <span><i>TOTAL</i>…</span>
          </div>
        </footer>

      </div></div>
    </div>
    <figcaption><h2>发射 · TX</h2><p>红色 TX 灯亮起，PTT 呼吸红光，扬声器格栅发热，波形跳动。</p></figcaption>
  </figure>

</main>

</body>
</html>
